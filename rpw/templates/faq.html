{% extends 'base.html' %}
{% block title %} — FAQ{% endblock %}
{% block content %}
<section class="faq-content"><p class="eyebrow">Reference / Help</p><h1>Frequently asked questions</h1>
  <div class="accordion" id="faq-section">
  {% for faq_item in faq_items %}<article class="card" id="faq-item-{{ loop.index }}"><div class="card-header" id="faq-q{{ loop.index }}"><h2 class="mb-0"><button class="btn btn-link" type="button" data-toggle="collapse" data-target="#faq-a{{ loop.index }}" aria-expanded="{{ 'true' if faq_item['show_number'] else 'false' }}" aria-controls="faq-a{{ loop.index }}">{{ faq_item['question'] | safe }}</button></h2></div><div id="faq-a{{ loop.index }}" class="collapse{% if faq_item['show_number'] %} show{% endif %}" aria-labelledby="faq-q{{ loop.index }}" data-parent="#faq-section"><div class="card-body">{{ faq_item['answer'] | safe }}</div></div></article>{% endfor %}
  </div>
</section>
{% endblock %}
